<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAGina Generator – Create Your Chatbot</title>
  <style>
    :root {
      --primary: #6C63FF;
      --bg: #0a0a14;
      --card: #111122;
      --text: #e0e0f0;
      --muted: #8888aa;
      --border: rgba(108,99,255,0.2);
      --success: #00d68f;
      --star-color: rgba(255,255,255,0.7);
      --sun-color: rgba(255,200,50,0.6);
      --transition-speed: 0.5s;
    }
    .light {
      --bg: #f5f5f9;
      --card: #ffffff;
      --text: #1a1a2e;
      --muted: #666666;
      --border: rgba(108,99,255,0.3);
      --star-color: transparent;
      --sun-color: rgba(255,180,20,0.8);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      transition: background var(--transition-speed), color var(--transition-speed);
      overflow-x: hidden;
      position: relative;
    }

    /* ========== ANIMATED BACKGROUND CANVAS ========== */
    #bgCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .hero { text-align:center; padding:3rem 1.5rem 1rem; position: relative; z-index: 1; }
    .hero .logo {
      width:100px; height:100px; border-radius:50%;
      margin-bottom:1rem;
      box-shadow:0 4px 20px rgba(108,99,255,0.4);
      cursor:pointer;
      animation: auto-spin 8s linear infinite;
      transition: box-shadow var(--transition-speed);
      position: relative;
      z-index: 2;
    }
    .hero .logo.fast { animation: fast-spin 0.6s ease-in-out; }
    @keyframes auto-spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes fast-spin { 0%{transform:rotate(0deg)} 50%{transform:rotate(360deg)} 100%{transform:rotate(360deg)} }

    .hero h1 {
      font-size: clamp(2rem,5vw,3.5rem);
      background: linear-gradient(135deg, var(--primary), #FF6584);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero p { color: var(--muted); margin-top:.5rem; }

    .container { max-width:650px; margin:0 auto; padding:1rem 1.5rem 3rem; position: relative; z-index: 1; }
    .card {
      background: var(--card); border:1px solid var(--border);
      border-radius:16px; padding:2rem; margin:1.5rem 0;
      transition: background var(--transition-speed), border-color var(--transition-speed);
    }
    .card h2 { font-size:1.3rem; margin-bottom:1rem; }
    label { display:block; font-weight:600; margin:1rem 0 .3rem; font-size:.85rem; color: var(--muted); }
    input,textarea,select {
      width:100%; background: rgba(0,0,0,0.1); border:1px solid var(--border);
      border-radius:10px; padding:.8rem 1rem; color: var(--text);
      font-family:inherit; font-size:.95rem;
      transition: background var(--transition-speed), border-color var(--transition-speed), color var(--transition-speed);
    }
    input:focus,textarea:focus,select:focus { outline:none; border-color:var(--primary); }
    textarea { resize:vertical; min-height:100px; font-size:.8rem; }
    .upload-area {
      border:2px dashed var(--border); border-radius:14px; padding:2rem;
      text-align:center; cursor:pointer; margin:1rem 0;
      transition: all var(--transition-speed);
    }
    .upload-area:hover, .upload-area.drag-over {
      border-color:var(--primary); background:rgba(108,99,255,0.05);
    }
    .upload-area input { display:none; }
    .file-list { font-size:.8rem; color:var(--muted); margin-top:.5rem; }
    .btn {
      display:block; width:100%;
      background: linear-gradient(135deg, var(--primary), #8b7cff);
      color:white; border:none; padding:1rem; border-radius:30px;
      font-weight:700; font-size:1.1rem; cursor:pointer; margin-top:1rem;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .btn:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(108,99,255,0.4); }
    .btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
    .success {
      background:rgba(0,214,143,0.1); border:1px solid var(--success);
      border-radius:12px; padding:1.5rem; text-align:center; margin:1.5rem 0;
      display:none;
    }
    .success.visible { display:block; }
    footer {
      text-align:center; padding:2rem; color:var(--muted); font-size:.8rem;
      position: relative; z-index: 1;
    }
    footer a { color:var(--primary); }

    /* ── Theme toggle indicator ── */
    .theme-indicator {
      position: fixed; top: 20px; right: 20px;
      background: var(--card); border:1px solid var(--border);
      border-radius: 30px; padding: 0.5rem 1.2rem;
      font-size: 0.85rem; color: var(--text);
      z-index: 10; cursor: pointer;
      transition: all var(--transition-speed);
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>

  <!-- Background animation canvas -->
  <canvas id="bgCanvas"></canvas>

  <!-- Theme indicator -->
  <div class="theme-indicator" id="themeIndicator" onclick="toggleTheme()">
    <span id="themeIcon">🌙</span> <span id="themeLabel">Dark</span>
  </div>

  <div class="hero">
    <img src="https://ragina-crawler-ragina.vercel.app/ragina-logo.png" 
         alt="RAGina Logo" class="logo" id="genLogo" onclick="toggleTheme()">
    <h1>⚡ RAGina Generator</h1>
    <p>Create an AI chatbot for your product in 60 seconds</p>
  </div>

  <div class="container">
    <div class="card">
      <h2>1️⃣ Product Name</h2>
      <label>What should we call your chatbot?</label>
      <input type="text" id="productName" value="MyProduct" placeholder="e.g., CloudDash, DocuFlow">
      <p style="color:var(--muted);font-size:.8rem;margin-top:.3rem">
        Bot name: <strong style="color:var(--primary)" id="previewName">RAGina powered by MyProduct</strong>
      </p>
    </div>
    <div class="card">
      <h2>2️⃣ Add Your Content</h2>
      <label>Upload HTML files (documentation, Confluence export, etc.)</label>
      <div class="upload-area" id="dropZone">
        <p>📁 <strong>Click or drop .html files here</strong></p>
        <p style="font-size:.8rem;color:var(--muted)">You can also select a whole folder</p>
        <input type="file" id="fileInput" webkitdirectory multiple accept=".html">
      </div>
      <div class="file-list" id="fileList"></div>
      <label style="margin-top:1rem">Or paste Q&A pairs (one per line: Q: ... A: ...)</label>
      <textarea id="sampleText" placeholder="What is CloudDash? CloudDash is a dashboard tool for analytics.&#10;How to install? Download from our website and run setup.&#10;Pricing starts at $10/month for the basic plan."></textarea>
    </div>
    <div class="card">
      <h2>3️⃣ Customize</h2>
      <label>Accent Color</label>
      <input type="text" id="accentColor" value="#6C63FF">
      <label>Chat Position</label>
      <select id="position">
        <option value="bottom-right">Bottom Right</option>
        <option value="bottom-left">Bottom Left</option>
      </select>
    </div>
    <button class="btn" id="generateBtn" disabled>🔮 Generate My Chatbot</button>
    <div class="success" id="successBox">
      <h3>✅ Your Chatbot is Ready!</h3>
      <p id="successMsg"></p>
      <button class="btn" id="downloadBtn" style="background:var(--success)">⬇ Download HTML File</button>
    </div>
  </div>

  <footer>
    <p>🧠 <a href="https://github.com/suryasticsai/RAGina">RAGina</a> – The Mentalist RAG</p>
  </footer>

  <script>
    // ═══════════════════════════════════════
    //  BACKGROUND ANIMATION (Stars / Sun)
    // ═══════════════════════════════════════
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let sunParticles = [];
    let animationId;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Create stars (dark mode)
    function createStars(count = 120) {
      stars = [];
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 2 + 0.5,
          twinkle: Math.random() * 0.03 + 0.005,
          opacity: Math.random() * 0.8 + 0.2
        });
      }
    }

    // Create sun particles (light mode)
    function createSunParticles(count = 60) {
      sunParticles = [];
      const cx = canvas.width * 0.5;
      const cy = canvas.height * 0.3;
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 50 + Math.random() * 250;
        sunParticles.push({
          x: cx + Math.cos(angle) * dist,
          y: cy + Math.sin(angle) * dist,
          baseX: cx + Math.cos(angle) * dist,
          baseY: cy + Math.sin(angle) * dist,
          size: Math.random() * 3 + 1,
          speed: 0.002 + Math.random() * 0.005,
          angle: angle,
          dist: dist,
          opacity: Math.random() * 0.5 + 0.3
        });
      }
    }

    function drawStars() {
      stars.forEach(s => {
        s.opacity += s.twinkle;
        if (s.opacity > 1 || s.opacity < 0.2) s.twinkle *= -1;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${Math.abs(s.opacity)})`;
        ctx.fill();
      });
    }

    function drawSun() {
      const cx = canvas.width * 0.5;
      const cy = canvas.height * 0.3;
      // Glow
      const gradient = ctx.createRadialGradient(cx, cy, 20, cx, cy, 300);
      gradient.addColorStop(0, 'rgba(255,200,80,0.9)');
      gradient.addColorStop(0.4, 'rgba(255,180,40,0.4)');
      gradient.addColorStop(1, 'rgba(255,150,20,0)');
      ctx.beginPath();
      ctx.arc(cx, cy, 300, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();

      // Sun rays
      sunParticles.forEach(p => {
        p.angle += p.speed;
        p.x = cx + Math.cos(p.angle) * p.dist;
        p.y = cy + Math.sin(p.angle) * p.dist;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,220,100,${p.opacity})`;
        ctx.fill();
      });
    }

    let isDark = true;
    createStars();
    createSunParticles();

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (isDark) {
        drawStars();
      } else {
        drawSun();
      }
      animationId = requestAnimationFrame(animate);
    }
    animate();

    // ═══════════════════════════════════════
    //  THEME TOGGLE
    // ═══════════════════════════════════════
    function toggleTheme() {
      const logo = document.getElementById('genLogo');
      logo.classList.add('fast');
      setTimeout(() => logo.classList.remove('fast'), 600);

      isDark = !isDark;
      const html = document.documentElement;
      const indicator = document.getElementById('themeIcon');
      const label = document.getElementById('themeLabel');

      if (isDark) {
        html.classList.remove('light');
        html.classList.add('dark');
        indicator.textContent = '🌙';
        label.textContent = 'Dark';
      } else {
        html.classList.add('light');
        html.classList.remove('dark');
        indicator.textContent = '☀️';
        label.textContent = 'Light';
      }

      // Recreate particles for new theme
      if (isDark) {
        createStars();
      } else {
        createSunParticles();
      }
    }

    // ═══════════════════════════════════════
    //  GENERATOR LOGIC (unchanged)
    // ═══════════════════════════════════════
    let uploadedFiles = [], generatedBlob = null;
    const dropZone = document.getElementById('dropZone'),
          fileInput = document.getElementById('fileInput'),
          fileList = document.getElementById('fileList'),
          productNameInput = document.getElementById('productName'),
          previewName = document.getElementById('previewName'),
          sampleText = document.getElementById('sampleText'),
          generateBtn = document.getElementById('generateBtn'),
          successBox = document.getElementById('successBox'),
          successMsg = document.getElementById('successMsg'),
          downloadBtn = document.getElementById('downloadBtn');

    productNameInput.addEventListener('input', () => {
      previewName.textContent = 'RAGina powered by ' + (productNameInput.value || 'MyProduct');
      checkReady();
    });
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault(); dropZone.classList.remove('drag-over');
      addFiles([...e.dataTransfer.files].filter(f => f.name.endsWith('.html')));
    });
    fileInput.addEventListener('change', () => {
      addFiles([...fileInput.files].filter(f => f.name.endsWith('.html')));
    });
    sampleText.addEventListener('input', checkReady);

    function addFiles(files) { uploadedFiles = [...uploadedFiles, ...files]; renderFileList(); checkReady(); }
    function renderFileList() {
      fileList.innerHTML = uploadedFiles.length > 0
        ? `<strong>${uploadedFiles.length} files loaded:</strong><br>` +
          uploadedFiles.map(f => '📄 ' + (f.webkitRelativePath || f.name)).join('<br>')
        : '';
    }
    function checkReady() {
      const hasFiles = uploadedFiles.length > 0,
            hasText = sampleText.value.trim().length > 0,
            hasName = productNameInput.value.trim().length > 0;
      generateBtn.disabled = !hasName || (!hasFiles && !hasText);
    }

    generateBtn.addEventListener('click', async () => {
      generateBtn.disabled = true; generateBtn.textContent = '⏳ Generating...';
      const productName = productNameInput.value.trim(),
            accentColor = document.getElementById('accentColor').value.trim() || '#6C63FF',
            position = document.getElementById('position').value;
      let knowledge = {};
      for (const file of uploadedFiles) {
        const text = await file.text(),
              doc = new DOMParser().parseFromString(text, 'text/html');
        knowledge[file.webkitRelativePath || file.name] = { bodyText: (doc.body?.textContent || '').trim() };
      }
      const sampleLines = sampleText.value.trim().split('\n').filter(l => l.trim());
      if (sampleLines.length > 0) { knowledge['sample-content'] = { bodyText: sampleLines.join('\n') }; }

      const knowledgeJSON = JSON.stringify(knowledge);
      const html = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAGina powered by ${productName}</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,sans-serif;background:#f5f5f9;min-height:100vh}
    .welcome{text-align:center;padding:3rem 1.5rem}
    .welcome .logo{width:100px;height:100px;border-radius:50%;margin-bottom:1rem;box-shadow:0 4px 20px rgba(108,99,255,0.3);cursor:pointer;animation:auto-spin 8s linear infinite}
    .welcome .logo.fast{animation:fast-spin 0.6s ease-in-out}
    @keyframes auto-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes fast-spin{0%{transform:rotate(0deg)}50%{transform:rotate(360deg)}100%{transform:rotate(360deg)}}
    .welcome h1{font-size:2.2rem;background:linear-gradient(135deg,${accentColor},#FF6584);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
    .welcome p{color:#666;font-size:1.1rem}
    .welcome .hint{margin-top:2rem;padding:1rem 1.5rem;background:rgba(${parseInt(accentColor.slice(1,3),16)},${parseInt(accentColor.slice(3,5),16)},${parseInt(accentColor.slice(5,7),16)},0.1);border-radius:12px;color:${accentColor};font-weight:600;display:inline-block}
  </style>
</head>
<body>
  <div class="welcome">
    <img src="https://ragina-crawler-ragina.vercel.app/ragina-logo.png" alt="RAGina Logo" class="logo" id="raginaLogo" onclick="spinLogo()">
    <h1>RAGina</h1>
    <p>powered by <strong>${productName}</strong></p>
    <div class="hint">👆 Click the chat bubble at the ${position==='bottom-right'?'bottom-right':'bottom-left'} to ask questions!</div>

    <div style="margin-top:2.5rem; font-size:0.85rem; color:#666; text-align:center;">
      <p style="margin-bottom:0.5rem;">
        ⚡ RAGina v2.0.6 · Created by 
        <a href="https://github.com/suryasticsai" target="_blank" style="color:${accentColor}; text-decoration:none; font-weight:600;">Suryasticsai</a>
      </p>
      <p style="font-size:0.75rem; color:#999;">
        ✦ Instant RAG &nbsp; ✦ No API keys needed &nbsp; ✦ Groq‑powered Answers &nbsp; ✦ Self‑hosted &nbsp; ✦ Offline‑first Knowledge &nbsp; ✦ GitHub Gist Memory &nbsp; ✦ Works with Confluence Exports &nbsp; ✦ Sassy Mentalist Attitude ✦
      </p>
      <p style="font-size:0.7rem; color:#aaa; margin-top:0.3rem;">
        Built for the community · MIT License · 
        <a href="https://github.com/suryasticsai/RAGina" target="_blank" style="color:${accentColor}; text-decoration:none; font-weight:600;">⭐ Star the repo on GitHub</a>
      </p>
    </div>
  </div>

  <script>
    function spinLogo(){
      var logo = document.getElementById('raginaLogo');
      logo.classList.add('fast');
      setTimeout(function(){ logo.classList.remove('fast'); }, 600);
    }
  <\/script>
  <script>window.__RAGINA_INDEX__=${knowledgeJSON};<\/script>
  <script>
    window.RAGINA_CONFIG={
      position:'${position}',
      placeholder:'Ask about ${productName}...',
      title:'RAGina | ${productName}',
      theme:{primary:'${accentColor}'}
    };
  <\/script>
  <script src="https://cdn.jsdelivr.net/gh/suryasticsai/RAGina@main/ragina.js"><\/script>
</body>
</html>`;

      generatedBlob = new Blob([html], { type: 'text/html' });
      successBox.classList.add('visible');
      successMsg.textContent = `Your chatbot "RAGina powered by ${productName}" is ready! Download and host it anywhere.`;
      generateBtn.textContent = '✅ Generated!';
      setTimeout(() => { generateBtn.textContent = '🔮 Generate My Chatbot'; generateBtn.disabled = false; }, 2000);
    });

    downloadBtn.addEventListener('click', () => {
      if (!generatedBlob) return;
      const url = URL.createObjectURL(generatedBlob), a = document.createElement('a');
      a.href = url; a.download = 'ragina-chatbot.html';
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
