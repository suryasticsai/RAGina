<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAGina – Instant Website Chatbot</title>
  <style>
    :root {
      --primary: #6C63FF;
      --bg: #0a0a14;
      --card: #111122;
      --text: #e0e0f0;
      --muted: #8888aa;
      --border: rgba(108,99,255,0.2);
      --success: #00d68f;
      --danger: #FF4757;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--primary), #FF6584);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { color: var(--muted); margin-bottom: 1.5rem; }
    input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      background: #0a0a18;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      margin-bottom: 1rem;
      transition: border-color 0.3s;
    }
    input:focus { outline: none; border-color: var(--primary); }
    .btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, var(--primary), #8b7cff);
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 30px;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(108,99,255,0.4); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-stop {
      background: var(--danger);
      margin-top: 0.5rem;
    }
    .status {
      margin: 1rem 0;
      padding: 0.8rem;
      border-radius: 10px;
      font-size: 0.9rem;
      display: none;
    }
    .status.info { background: rgba(108,99,255,0.15); border: 1px solid rgba(108,99,255,0.3); display: block; }
    .status.success { background: rgba(0,214,143,0.1); border: 1px solid var(--success); display: block; }
    .status.error { background: rgba(255,71,87,0.1); border: 1px solid var(--danger); display: block; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 0.5rem; }
    #chatMessages p { margin-bottom: 0.5rem; text-align: left; }

    .progress-container {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      margin: 1rem 0;
      overflow: hidden;
      display: none;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #FF6584);
      border-radius: 10px;
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-text {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.3rem;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top: 2px solid var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔮 RAGina Instant</h1>
    <p>Paste any website URL – she reads it and answers your questions.</p>
    <input type="url" id="urlInput" placeholder="https://docs.yourproduct.com" value="https://example.com">
    <button class="btn" id="crawlBtn">Crawl & Launch Chatbot</button>
    <div class="status info" id="statusBox"><span class="spinner"></span> Ready to crawl</div>
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressText"></div>
    <button class="btn btn-stop" id="stopBtn" style="display:none;">⏹ Stop Crawl</button>
    <div class="hint">No API keys. No files. Just a URL.</div>
  </div>

  <script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.1.2/dist/transformers.min.js';

    const urlInput = document.getElementById('urlInput');
    const crawlBtn = document.getElementById('crawlBtn');
    const statusBox = document.getElementById('statusBox');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const stopBtn = document.getElementById('stopBtn');

    let generator = null;
    let chunks = [];
    let idf = {};
    let abortController = null;

    const CRAWL_PROXY = 'https://ragina-crawler-ragina.vercel.app/api/crawl';

    function setProgress(percent, message) {
      progressContainer.style.display = 'block';
      progressBar.style.width = percent + '%';
      progressText.textContent = message;
    }

    function showStatus(msg, type = 'info') {
      statusBox.className = `status ${type}`;
      statusBox.innerHTML = msg;
    }

    // Load the keyless in‑browser LLM
    async function loadModel() {
      showStatus('<span class="spinner"></span> Loading AI model (first time ~1 min, cached next time)...', 'info');
      generator = await pipeline('text2text-generation', 'Xenova/LaMini-Flan-T5-783M');
      showStatus('✅ Model loaded. Ready to crawl.', 'success');
    }

    // Crawl with timeout and abort
    async function crawlWebsite(url) {
      abortController = new AbortController();
      stopBtn.style.display = 'block';

      progressContainer.style.display = 'block';
      setProgress(5, 'Starting crawl...');
      showStatus('<span class="spinner"></span> Crawling website...', 'info');

      const CRAWL_TIMEOUT = 40000; // 40 seconds
      const timeoutId = setTimeout(() => {
        abortController.abort();
      }, CRAWL_TIMEOUT);

      let fakeProgress = 5;
      const progressInterval = setInterval(() => {
        if (fakeProgress < 90) {
          fakeProgress += Math.floor(Math.random() * 8) + 3;
          if (fakeProgress > 90) fakeProgress = 90;
          setProgress(fakeProgress, `Crawling pages… (${fakeProgress}%)`);
        }
      }, 1200);

      try {
        const res = await fetch(CRAWL_PROXY, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
          signal: abortController.signal
        });

        clearTimeout(timeoutId);
        clearInterval(progressInterval);

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        if (data.error) throw new Error(data.error);

        setProgress(100, 'Crawl complete!');
        showStatus(`✅ Crawled ${data.pages.length} pages. Building knowledge base…`, 'success');
        stopBtn.style.display = 'none';
        return data.pages || [];
      } catch (err) {
        clearTimeout(timeoutId);
        clearInterval(progressInterval);
        stopBtn.style.display = 'none';
        if (err.name === 'AbortError') {
          throw new Error('Crawl timed out (40s). The site might be too large or slow. Try a smaller site.');
        }
        throw err;
      }
    }

    // Stop button handler
    stopBtn.addEventListener('click', () => {
      if (abortController) {
        abortController.abort();
        abortController = null;
      }
    });

    // Build TF‑IDF index
    function buildIndex(pages) {
      chunks = [];
      for (const page of pages) {
        const text = page.content;
        if (!text || text.length < 50) continue;
        const sentences = text.split(/\n+|(?<=[.!?])\s+/);
        let current = '';
        for (const s of sentences) {
          if ((current + s).length > 200 && current.length > 0) {
            chunks.push({ text: current.trim(), source: page.url });
            current = '';
          }
          current += s + ' ';
        }
        if (current.trim()) chunks.push({ text: current.trim(), source: page.url });
      }
      idf = {};
      const total = chunks.length || 1;
      for (const ch of chunks) {
        const words = new Set(ch.text.toLowerCase().match(/\b\w+\b/g) || []);
        for (const w of words) idf[w] = (idf[w] || 0) + 1;
      }
      for (const w in idf) idf[w] = Math.log(total / (1 + idf[w]));
    }

    function retrieve(query, topK = 3) {
      const qWords = query.toLowerCase().match(/\b\w+\b/g) || [];
      const qTF = {};
      for (const w of qWords) qTF[w] = (qTF[w] || 0) + 1;
      const scores = chunks.map((ch, idx) => {
        const cWords = ch.text.toLowerCase().match(/\b\w+\b/g) || [];
        const cTF = {};
        for (const w of cWords) cTF[w] = (cTF[w] || 0) + 1;
        let score = 0;
        for (const w of Object.keys(qTF)) {
          if (cTF[w] && idf[w]) score += qTF[w] * cTF[w] * idf[w];
        }
        return { idx, score };
      });
      scores.sort((a, b) => b.score - a.score);
      return scores.slice(0, topK).map(s => chunks[s.idx]);
    }

    async function answerQuestion(question) {
      const topChunks = retrieve(question);
      const context = topChunks.map((c, i) => `[${i+1}] ${c.source}\n${c.text}`).join('\n\n');
      const prompt = `Answer the question using only the context. If you cannot find the answer, say "I don't know".\n\nContext:\n${context}\n\nQuestion: ${question}\nAnswer:`;
      const result = await generator(prompt, { max_new_tokens: 150 });
      return result[0].generated_text.replace(prompt, '').trim();
    }

    function showChatUI() {
      document.querySelector('.container').innerHTML = `
        <h1>🔮 RAGina Chat</h1>
        <p>Ask questions about the crawled website</p>
        <div id="chatMessages" style="max-height:400px;overflow-y:auto;text-align:left;background:#0a0a18;padding:1rem;border-radius:12px;margin:1rem 0;"></div>
        <div style="display:flex;gap:0.5rem;">
          <input type="text" id="questionInput" placeholder="Ask a question..." style="flex:1;">
          <button class="btn" id="askBtn" style="width:auto;">Ask</button>
        </div>
      `;

      const messages = document.getElementById('chatMessages');
      const questionInput = document.getElementById('questionInput');
      const askBtn = document.getElementById('askBtn');

      async function ask() {
        const q = questionInput.value.trim();
        if (!q) return;
        questionInput.value = '';
        messages.innerHTML += `<p><strong>You:</strong> ${q}</p>`;
        messages.innerHTML += '<p><em>Thinking…</em></p>';
        try {
          const answer = await answerQuestion(q);
          messages.innerHTML = messages.innerHTML.replace('<p><em>Thinking…</em></p>', '');
          messages.innerHTML += `<p><strong>RAGina:</strong> ${answer}</p>`;
        } catch (err) {
          messages.innerHTML = messages.innerHTML.replace('<p><em>Thinking…</em></p>', '');
          messages.innerHTML += `<p style="color:var(--danger);">Error: ${err.message}</p>`;
        }
        messages.scrollTop = messages.scrollHeight;
      }

      askBtn.addEventListener('click', ask);
      questionInput.addEventListener('keypress', e => { if (e.key === 'Enter') ask(); });
    }

    // Main flow
    crawlBtn.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      if (!url) return;
      crawlBtn.disabled = true;
      crawlBtn.textContent = '⏳ Crawling...';
      progressContainer.style.display = 'none';
      progressBar.style.width = '0%';
      progressText.textContent = '';

      try {
        if (!generator) await loadModel();
        const pages = await crawlWebsite(url);
        buildIndex(pages);
        showStatus(`✅ Indexed ${pages.length} pages. Launching chat…`, 'success');
        setTimeout(() => showChatUI(), 500);
      } catch (err) {
        showStatus('❌ ' + err.message, 'error');
        crawlBtn.disabled = false;
        crawlBtn.textContent = 'Crawl & Launch Chatbot';
      }
    });

    // Pre‑load model in background
    loadModel();
  </script>
</body>
</html>
