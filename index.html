<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAGina – The Mentalist RAG</title>
    <link rel="icon" type="image/png" href="ragina-logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #6C63FF;
            --bg: #0a0a14;
            --card: #111122;
            --text: #e0e0f0;
            --muted: #8888aa;
            --border: rgba(108,99,255,0.2);
            --success: #00d68f;
            --danger: #FF4757;
            --transition-speed: 0.5s;
        }
        .light {
            --bg: #f5f5f9;
            --card: #ffffff;
            --text: #1a1a2e;
            --muted: #666666;
            --border: rgba(108,99,255,0.3);
            --primary: #4b44cc;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            transition: background var(--transition-speed), color var(--transition-speed);
            overflow-x: hidden;
            position: relative;
        }
        canvas#bgCanvas { position: fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events: none; }
        .navbar {
            background: rgba(10,10,20,0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            z-index: 10;
            position: sticky; top: 0;
            padding: 0.5rem 1rem;
            transition: background var(--transition-speed), border-color var(--transition-speed);
        }
        .navbar .logo { width:40px; height:40px; border-radius:50%; margin-right:0.5rem; cursor:pointer; animation: auto-spin 8s linear infinite; transition: box-shadow var(--transition-speed); }
        .navbar .logo.fast { animation: fast-spin 0.6s ease-in-out; }
        @keyframes auto-spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
        @keyframes fast-spin { 0%{transform:rotate(0deg)} 50%{transform:rotate(360deg)} 100%{transform:rotate(360deg)} }
        .brand-text { font-weight:700; background: linear-gradient(135deg, var(--primary), #FF6584); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-size:1.3rem; }
        .theme-toggle { cursor:pointer; border: none; background: none; color: var(--text); font-size:1.2rem; }
        .theme-indicator { position: fixed; top: 20px; right: 20px; background: var(--card); border:1px solid var(--border); border-radius:30px; padding:0.3rem 1rem; font-size:0.85rem; color:var(--text); z-index:100; cursor:pointer; transition: all var(--transition-speed); backdrop-filter: blur(5px); display:none; }
        .avatar { width:32px; height:32px; border-radius:50%; object-fit:cover; border:2px solid var(--primary); }
        .btn-primary-ragina { background: var(--primary); border:none; color:white; }
        .btn-primary-ragina:hover { background: #5a52d5; }
        .btn-outline-ragina { border:1px solid var(--primary); color:var(--primary); }
        .btn-outline-ragina:hover { background: var(--primary); color:white; }
        .card-ragina { background: var(--card); border:1px solid var(--border); border-radius:16px; padding:1.5rem; margin-bottom:1.5rem; transition: all var(--transition-speed); }
        .progress-bar-ragina { background: linear-gradient(90deg, var(--primary), #FF6584); }
        .chat-messages { max-height:400px; overflow-y:auto; background: rgba(0,0,0,0.05); border-radius:12px; padding:1rem; }
        .chat-messages .user { text-align:right; }
        .chat-messages .bot { text-align:left; }
        .chat-messages span { display:inline-block; max-width:80%; padding:8px 16px; border-radius:18px; margin:4px 0; }
        .chat-messages .user span { background: var(--primary); color:white; }
        .chat-messages .bot span { background: rgba(108,99,255,0.1); border:1px solid rgba(108,99,255,0.3); color:var(--text); }
        .kb-tile { background: var(--card); border:1px solid var(--border); border-radius:16px; padding:1.5rem; margin:1rem 0; transition: all var(--transition-speed); }
        .stats { font-size:0.9rem; color:var(--muted); }
        .toast { background: var(--card); color:var(--text); border:1px solid var(--border); }
        footer { border-top:1px solid var(--border); }
        /* Thunderstorm flash */
        .flash { position: fixed; top:0; left:0; width:100%; height:100%; background: white; opacity:0; z-index:9999; pointer-events:none; animation: flash 0.5s ease-out; }
        @keyframes flash { 0%{opacity:0.8} 100%{opacity:0} }
        /* Cloud styles (drawn on canvas) */
        .hidden { display:none; }
        .file-list { max-height:220px; overflow-y:auto; margin:.8rem 0; border:1px solid var(--border); border-radius:10px; background:#0a0a18; }
        .file-row { display:flex; align-items:center; gap:.6rem; padding:.6rem 1rem; border-bottom:1px solid rgba(255,255,255,.03); cursor:pointer; font-size:.85rem; color:var(--text); }
        .file-row:hover { background:rgba(108,99,255,.08); }
        .file-row.selected { background:rgba(108,99,255,.15); border-left:3px solid var(--primary); }
        .file-row .check { color:var(--success); opacity:0; }
        .file-row.selected .check { opacity:1; }
        .radio-row { display:flex; gap:.8rem; margin:.8rem 0; }
        .radio-card { flex:1; position:relative; }
        .radio-card input { position:absolute; opacity:0; }
        .radio-card label { display:flex; align-items:center; gap:.5rem; padding:.8rem 1rem; border:2px solid var(--border); border-radius:12px; cursor:pointer; font-weight:500; }
        .radio-card input:checked+label { border-color:var(--primary); background:rgba(108,99,255,.1); }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <div class="theme-indicator" id="themeIndicator" onclick="toggleTheme()"><span id="themeIcon">🌙</span> Dark</div>

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="https://ragina-crawler-ragina.vercel.app/ragina-logo.png" alt="RAGina" class="logo" id="navLogo" onclick="toggleTheme()">
                <span class="brand-text">RAGina</span>
            </a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
                <div id="userArea">
                    <button class="btn btn-outline-light btn-sm" id="loginBtn"><i class="fab fa-github me-1"></i> Login</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-4" style="max-width: 1000px; position: relative; z-index: 1;">
        <!-- Target Input -->
        <div class="card card-ragina mb-4">
            <h4 class="mb-3">🎯 Enter a Repository or Website URL</h4>
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fas fa-search"></i></span>
                <input type="text" id="targetInput" class="form-control" placeholder="e.g., user/repo or https://example.com">
                <button class="btn btn-primary-ragina" id="exploreBtn">🔍 Explore</button>
            </div>
            <div class="status info" id="targetStatus"></div>

            <!-- Page tree (for both repo files & website pages) -->
            <div id="pageTreeSection" style="display:none;">
                <h6>Select up to 5 items to scrape:</h6>
                <div class="file-list" id="treeContainer"></div>
                <div class="d-flex align-items-center gap-2 mt-2">
                    <button class="btn btn-outline-ragina btn-sm" id="scrapeSelectedBtn"><i class="fas fa-download me-1"></i> Scrape Selected</button>
                    <span class="text-muted small" id="selectedCount">0 selected</span>
                </div>
            </div>
        </div>

        <!-- PR Configuration (only shown for repos) -->
        <div id="prSection" style="display:none;">
            <div class="card card-ragina mb-4">
                <h4 class="mb-3">⚙️ PR Configuration</h4>
                <div class="radio-row">
                    <div class="radio-card">
                        <input type="radio" name="injectMode" id="modeExisting" value="existing" checked>
                        <label for="modeExisting">📄 Inject into existing file</label>
                    </div>
                    <div class="radio-card">
                        <input type="radio" name="injectMode" id="modeNew" value="new">
                        <label for="modeNew">📝 Create new chatbot page</label>
                    </div>
                </div>
                <div id="existingFileSection">
                    <label>Select target HTML file:</label>
                    <select id="targetFileSelect" class="form-select mb-3"></select>
                    <label>Injection location:</label>
                    <select id="injectLocation" class="form-select">
                        <option value="beforeBodyEnd">Before &lt;/body&gt; (recommended)</option>
                        <option value="afterBodyStart">After &lt;body&gt; tag</option>
                        <option value="beforeHeadEnd">Before &lt;/head&gt; tag</option>
                    </select>
                </div>
                <div id="newFileSection" style="display:none;">
                    <p class="text-muted">📝 A new file <code>ragina-chatbot.html</code> will be created in the repo root.</p>
                </div>
                <label>Product Name *</label>
                <input type="text" id="productName" class="form-control mb-2" placeholder="e.g., MyProduct">
                <label>Accent Color</label>
                <input type="text" id="accentColor" class="form-control mb-2" value="#6C63FF">
                <label>PR Title</label>
                <input type="text" id="prTitle" class="form-control mb-2" value="🤖 Add RAGina AI Chatbot">
                <label>PR Description</label>
                <textarea id="prBody" class="form-control mb-2" rows="3">## 🤖 What this PR does
Adds RAGina - an AI chatbot that answers questions.

## ✨ Features
- 💬 Floating chat bubble
- 🧠 Answers from product knowledge
- 🔐 No API keys needed
- 📱 Works on mobile</textarea>
                <button class="btn btn-primary-ragina" id="raisePRBtn" disabled>🔮 Raise PR</button>
                <div class="status info" id="prStatus"></div>
                <div class="log" id="logBox"></div>
            </div>
        </div>

        <!-- Knowledge Base Section -->
        <div id="kbSection" style="display:none;">
            <div class="kb-tile" id="kbTile">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h5><i class="fas fa-brain me-2"></i>Knowledge Base</h5>
                        <div class="stats" id="kbStats"></div>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-success btn-sm" id="downloadBtn"><i class="fas fa-download me-1"></i> Download JSON</button>
                        <button class="btn btn-outline-success btn-sm" id="gistBtn"><i class="fab fa-github me-1"></i> Save to Gist</button>
                        <button class="btn btn-outline-info btn-sm" id="editKbBtn"><i class="fas fa-edit me-1"></i> Edit KB</button>
                    </div>
                </div>
            </div>

            <!-- Chat -->
            <div class="card card-ragina mt-3" id="chatSection">
                <h5><i class="fas fa-comments me-2"></i>Chat with the crawled content</h5>
                <div class="chat-messages mb-3" id="chatMessages"></div>
                <div class="input-group">
                    <input type="text" id="questionInput" class="form-control" placeholder="Ask a question...">
                    <button class="btn btn-primary-ragina" id="askBtn"><i class="fas fa-paper-plane me-1"></i> Ask</button>
                </div>
            </div>
        </div>
    </div>

    <!-- KB Editor Modal -->
    <div class="modal fade" id="kbEditorModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content bg-dark text-light">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Knowledge Base</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <textarea id="kbEditorTextarea" class="form-control bg-dark text-light" rows="20"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary-ragina" id="saveKbBtn">Save KB</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

    <footer class="py-3 text-center text-muted small">
        <div class="container">
            <img src="https://ragina-crawler-ragina.vercel.app/ragina-logo.png" alt="RAGina" height="24" class="me-1"> RAGina – The Mentalist RAG · <a href="https://github.com/suryasticsai/RAGina" target="_blank">⭐ Star on GitHub</a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // ═══════════════════════════════════════════════
    //  BACKGROUND ANIMATION (Stars/Sun/Clouds/Thunder)
    // ═══════════════════════════════════════════════
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [], sunParticles = [], clouds = [], lightningTimer = null;
    let isDark = true;
    let animationId;

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    function createStars(count = 120) {
        stars = [];
        for (let i = 0; i < count; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 2 + 0.5, twinkle: Math.random() * 0.03 + 0.005, opacity: Math.random() * 0.8 + 0.2 });
        }
    }
    function createSunParticles(count = 60) {
        sunParticles = [];
        const cx = canvas.width * 0.5, cy = canvas.height * 0.3;
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 50 + Math.random() * 250;
            sunParticles.push({ x: cx + Math.cos(angle) * dist, y: cy + Math.sin(angle) * dist, baseX: cx + Math.cos(angle) * dist, baseY: cy + Math.sin(angle) * dist, size: Math.random() * 3 + 1, speed: 0.002 + Math.random() * 0.005, angle, dist, opacity: Math.random() * 0.5 + 0.3 });
        }
    }
    function createClouds() {
        clouds = [];
        for (let i = 0; i < 8; i++) {
            clouds.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height * 0.6 + 50, width: 80 + Math.random() * 150, height: 40 + Math.random() * 50, speed: 0.3 + Math.random() * 0.7, opacity: 0.4 + Math.random() * 0.3 });
        }
    }

    function drawStars() {
        stars.forEach(s => {
            s.opacity += s.twinkle;
            if (s.opacity > 1 || s.opacity < 0.2) s.twinkle *= -1;
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
            ctx.fillStyle = `rgba(255,255,255,${Math.abs(s.opacity)})`;
            ctx.fill();
        });
    }
    function drawSun() {
        const cx = canvas.width * 0.5, cy = canvas.height * 0.3;
        const gradient = ctx.createRadialGradient(cx, cy, 20, cx, cy, 300);
        gradient.addColorStop(0, 'rgba(255,200,80,0.9)'); gradient.addColorStop(0.4, 'rgba(255,180,40,0.4)'); gradient.addColorStop(1, 'rgba(255,150,20,0)');
        ctx.beginPath(); ctx.arc(cx, cy, 300, 0, Math.PI*2);
        ctx.fillStyle = gradient; ctx.fill();
        sunParticles.forEach(p => { p.angle += p.speed; p.x = cx + Math.cos(p.angle) * p.dist; p.y = cy + Math.sin(p.angle) * p.dist; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fillStyle = `rgba(255,220,100,${p.opacity})`; ctx.fill(); });
    }
    function drawClouds() {
        clouds.forEach(c => {
            c.x += c.speed;
            if (c.x > canvas.width + c.width) c.x = -c.width;
            ctx.fillStyle = `rgba(255,255,255,${c.opacity})`;
            ctx.beginPath(); ctx.ellipse(c.x, c.y, c.width/2, c.height/2, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(c.x - c.width*0.3, c.y + c.height*0.2, c.width*0.4, c.height*0.4, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(c.x + c.width*0.3, c.y + c.height*0.2, c.width*0.4, c.height*0.4, 0, 0, Math.PI*2); ctx.fill();
        });
    }
    function triggerLightning() {
        const flash = document.createElement('div');
        flash.className = 'flash';
        document.body.appendChild(flash);
        setTimeout(() => flash.remove(), 500);
    }
    function startThunderstorm() {
        if (lightningTimer) clearInterval(lightningTimer);
        lightningTimer = setInterval(() => { if (Math.random() < 0.3) triggerLightning(); }, 4000 + Math.random() * 8000);
    }

    createStars(); createSunParticles(); createClouds(); startThunderstorm();

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (isDark) {
            drawStars();
            // dark clouds (storm)
            clouds.forEach(c => { c.x += c.speed; if (c.x > canvas.width + c.width) c.x = -c.width; ctx.fillStyle = `rgba(30,30,50,${c.opacity})`; ctx.beginPath(); ctx.ellipse(c.x, c.y, c.width/2, c.height/2, 0, 0, Math.PI*2); ctx.fill(); });
        } else {
            drawSun();
            drawClouds();
        }
        animationId = requestAnimationFrame(animate);
    }
    animate();

    // ═══════════════════════════════════════════════
    //  GLOBAL STATE
    // ═══════════════════════════════════════════════
    let githubToken = null;
    let repoOwner = null, repoName = null, isRepoMode = false;
    let allRepoFiles = [], htmlFiles = [], selectedFile = null;
    let knowledge = null, chunks = [], idf = {}, currentCrawlUrl = '';
    let gistMemory = {}, currentGistId = null, savingGist = false;
    let currentBranchName = null;
    const CRAWL_PROXY = 'https://ragina-crawler-ragina.vercel.app/api/crawl';
    const MAP_PROXY = 'https://ragina-crawler-ragina.vercel.app/api/map';
    const ASK_PROXY = 'https://ragina-crawler-ragina.vercel.app/api/ask';
    const GIST_PROXY = 'https://ragina-crawler-ragina.vercel.app/api/gist';
    const GITHUB_CLIENT_ID = 'Ov23lizeWF08DBQn2djN';
    const REDIRECT_URI = 'https://ragina-crawler-ragina.vercel.app/api/auth';

    // ═══════════════════════════════════════════════
    //  UTILS
    // ═══════════════════════════════════════════════
    const $ = (s) => document.querySelector(s);
    const showToast = (msg, type='success') => {
        const t = document.createElement('div');
        t.className = `toast align-items-center text-bg-${type} border-0`;
        t.innerHTML = `<div class="d-flex"><div class="toast-body">${msg}</div><button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
        $('#toastContainer').appendChild(t);
        new bootstrap.Toast(t).show();
        setTimeout(() => t.remove(), 5000);
    };
    const setStatus = (el, msg, type='info') => { el.className = `status ${type} visible`; el.innerHTML = msg; };
    const normalizeUrl = (url) => { try { let u = new URL(url); u.hostname = u.hostname.replace(/^www\./,''); u.protocol='https:'; u.hash=''; u.search=''; let p = u.pathname.replace(/\/$/,''); u.pathname = p||'/'; return u.toString(); } catch { return url; } };
    const getSiteIdentifier = (url) => { try { return new URL(url).hostname.replace(/^www\./,'').replace(/[^a-zA-Z0-9.-]/g,'_'); } catch { return 'unknown'; } };
    const logPR = (msg, type='info') => { const box = $('#logBox'); box.classList.add('visible'); const d = document.createElement('div'); d.className = `log-${type}`; d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`; box.appendChild(d); box.scrollTop = box.scrollHeight; };

    // ═══════════════════════════════════════════════
    //  THEME TOGGLE
    // ═══════════════════════════════════════════════
    function toggleTheme() {
        const logo = $('#navLogo');
        logo.classList.add('fast');
        setTimeout(() => logo.classList.remove('fast'), 600);
        isDark = !isDark;
        const html = document.documentElement;
        if (isDark) {
            html.classList.remove('light'); html.classList.add('dark');
            $('#themeIcon').textContent = '🌙'; $('#themeIndicator').innerHTML = '🌙 Dark';
            $('#themeToggleBtn').innerHTML = '<i class="fas fa-moon"></i>';
            createStars(); startThunderstorm();
        } else {
            html.classList.add('light'); html.classList.remove('dark');
            $('#themeIcon').textContent = '☀️'; $('#themeIndicator').innerHTML = '☀️ Light';
            $('#themeToggleBtn').innerHTML = '<i class="fas fa-sun"></i>';
            createSunParticles(); createClouds();
            if (lightningTimer) { clearInterval(lightningTimer); lightningTimer = null; }
        }
    }
    $('#themeToggleBtn').addEventListener('click', toggleTheme);
    $('#themeIndicator').addEventListener('click', toggleTheme);

    // ═══════════════════════════════════════════════
    //  GITHUB LOGIN
    // ═══════════════════════════════════════════════
    async function loadGistMemory() {
        if (!githubToken) return;
        try {
            const res = await fetch('https://api.github.com/gists', { headers: { Authorization: `Bearer ${githubToken}` } });
            const gists = await res.json();
            gistMemory = {};
            for (const g of gists) {
                const desc = (g.description||''); const match = desc.match(/^RAGina:\s*(.+)/);
                if (match && g.files && Object.keys(g.files).length) gistMemory[normalizeUrl(match[1])] = g.id;
            }
        } catch(e) { console.warn(e); }
    }
    function updateUserUI() {
        if (githubToken) {
            fetch('https://api.github.com/user', { headers: { Authorization: `Bearer ${githubToken}` } })
            .then(r => r.json()).then(user => {
                $('#userArea').innerHTML = `<div class="d-flex align-items-center gap-2"><img src="${user.avatar_url}" class="avatar"><span>${user.login}</span><button class="btn btn-sm btn-outline-danger" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button></div>`;
                $('#logoutBtn').addEventListener('click', () => { githubToken = null; knowledge = null; gistMemory = {}; updateUserUI(); $('#kbSection').style.display='none'; });
                loadGistMemory();
            });
            $('#gistBtn').style.display = 'inline-block';
            if ($('#gistBtn2')) $('#gistBtn2').style.display = 'inline-block';
        } else {
            $('#userArea').innerHTML = `<button class="btn btn-outline-light btn-sm" id="loginBtn"><i class="fab fa-github me-1"></i> Login</button>`;
            $('#loginBtn').addEventListener('click', () => window.location.href = `https://github.com/login/oauth/authorize?client_id=${GITHUB_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=repo,gist`);
            $('#gistBtn').style.display = 'none';
            if ($('#gistBtn2')) $('#gistBtn2').style.display = 'none';
        }
    }
    if (window.location.hash.startsWith('#access_token=')) { githubToken = window.location.hash.split('=')[1]; history.replaceState(null,'',window.location.pathname); }
    updateUserUI();

    // ═══════════════════════════════════════════════
    //  EXPLORE (REPO or URL)
    // ═══════════════════════════════════════════════
    $('#exploreBtn').addEventListener('click', async () => {
        const target = $('#targetInput').value.trim();
        if (!target) return;
        // Determine if repo or URL
        if (target.includes('/') && !target.startsWith('http')) {
            // Repo mode
            if (!githubToken) { showToast('Login with GitHub first.','warning'); return; }
            [repoOwner, repoName] = target.split('/');
            isRepoMode = true;
            $('#prSection').style.display = 'block';
            await scanRepo();
        } else if (target.startsWith('http')) {
            // URL mode
            isRepoMode = false;
            $('#prSection').style.display = 'none';
            currentCrawlUrl = target;
            await exploreWebsite(target);
        } else {
            showToast('Enter a valid repo (user/repo) or URL.','warning');
        }
    });

    async function scanRepo() {
        $('#exploreBtn').disabled = true; $('#exploreBtn').innerHTML = '<span class="spinner-border spinner-border-sm"></span> Scanning...';
        allRepoFiles = []; htmlFiles = [];
        try {
            await scanDir(repoOwner, repoName, '');
            htmlFiles = allRepoFiles.filter(f => /\.html?$/i.test(f.name));
            logPR(`Found ${htmlFiles.length} HTML files`, 'success');
            renderFileTree(htmlFiles, f => f.name); // for repo, show file names
            $('#pageTreeSection').style.display = 'block';
            populatePRFileSelect(htmlFiles);
        } catch(e) { showToast('Scan failed: '+e.message, 'danger'); }
        $('#exploreBtn').disabled = false; $('#exploreBtn').innerHTML = '🔍 Explore';
    }

    async function exploreWebsite(url) {
        $('#exploreBtn').disabled = true; $('#exploreBtn').innerHTML = '<span class="spinner-border spinner-border-sm"></span> Exploring...';
        try {
            const res = await fetch(MAP_PROXY, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url}) });
            const data = await res.json();
            if (data.error) throw new Error(data.error);
            const urls = data.urls || [];
            if (urls.length === 0) { showToast('No pages found.','warning'); $('#exploreBtn').disabled = false; $('#exploreBtn').innerHTML = '🔍 Explore'; return; }
            renderFileTree(urls, u => new URL(u).pathname || '/');
            $('#pageTreeSection').style.display = 'block';
        } catch(e) { showToast('Explore failed: '+e.message, 'danger'); }
        $('#exploreBtn').disabled = false; $('#exploreBtn').innerHTML = '🔍 Explore';
    }

    async function scanDir(owner, repo, path) {
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
        const r = await fetch(url, { headers: { Authorization: `Bearer ${githubToken}`, Accept: 'application/vnd.github+json' } });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const items = await r.json();
        for (const item of (Array.isArray(items)?items:[items])) {
            if (item.type === 'file') allRepoFiles.push(item);
            else if (item.type === 'dir' && !item.name.startsWith('.') && item.name !== 'node_modules' && item.name !== '.git') await scanDir(owner, repo, item.path);
        }
    }

    function renderFileTree(items, labelFn) {
        const container = $('#treeContainer'); container.innerHTML = '';
        items.forEach((item, i) => {
            const isFile = isRepoMode ? item.name : true; // all are URLs in website mode
            const label = labelFn(item);
            const div = document.createElement('div'); div.className = 'file-row';
            div.innerHTML = `<span class="icon">${isRepoMode?'📄':'🔗'}</span><span class="name">${label}</span><span class="check">✅</span>`;
            div.addEventListener('click', () => {
                div.classList.toggle('selected');
                updateSelectedCount();
            });
            container.appendChild(div);
        });
        updateSelectedCount();
    }

    function updateSelectedCount() {
        const count = $('#treeContainer').querySelectorAll('.file-row.selected').length;
        $('#selectedCount').textContent = count + ' selected';
        if (count > 5) {
            const sel = $('#treeContainer').querySelectorAll('.file-row.selected');
            sel[sel.length-1].classList.remove('selected');
            showToast('Max 5 pages allowed.','warning');
            return updateSelectedCount();
        }
    }

    function populatePRFileSelect(htmlFiles) {
        const sel = $('#targetFileSelect'); sel.innerHTML = '';
        htmlFiles.forEach(f => { const opt = document.createElement('option'); opt.value = f.path; opt.textContent = f.path; sel.appendChild(opt); });
    }

    // ═══════════════════════════════════════════════
    //  SCRAPE SELECTED
    // ═══════════════════════════════════════════════
    $('#scrapeSelectedBtn').addEventListener('click', async () => {
        const selectedRows = $('#treeContainer').querySelectorAll('.file-row.selected');
        if (selectedRows.length === 0) return showToast('Select at least one item.','warning');
        const btn = $('#scrapeSelectedBtn'); btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Scraping...';
        try {
            if (isRepoMode) {
                // Scrape from repo files
                const selectedPaths = Array.from(selectedRows).map(row => row.querySelector('.name').textContent);
                const filesToScrape = htmlFiles.filter(f => selectedPaths.includes(f.name));
                const knowledgeData = {};
                for (const f of filesToScrape) {
                    const res = await fetch(f.download_url); const html = await res.text();
                    const doc = new DOMParser().parseFromString(html, 'text/html');
                    const clone = doc.body.cloneNode(true); clone.querySelectorAll('script,style,noscript').forEach(el=>el.remove());
                    knowledgeData[f.path] = { bodyText: (clone.textContent||'').trim().replace(/\s+/g,' ').slice(0,2000) };
                }
                // Also add product description if available
                const prodName = $('#productName').value.trim();
                if (prodName) knowledgeData['product-overview'] = { bodyText: `${prodName}: Product description.` };
                await buildKnowledgeFromData(knowledgeData);
            } else {
                // Scrape website pages
                const selectedUrls = Array.from(selectedRows).map(row => row.querySelector('.name').textContent);
                const res = await fetch(CRAWL_PROXY, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({urls:selectedUrls}) });
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                await buildKnowledgeFromPages(data.pages);
            }
        } catch(e) { showToast('Scrape error: '+e.message, 'danger'); }
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-download me-1"></i> Scrape Selected';
    });

    async function buildKnowledgeFromData(knowledgeData) {
        // Convert to pages format and build
        const pages = Object.entries(knowledgeData).map(([url, {bodyText}]) => ({url, content: bodyText}));
        await buildKnowledgeFromPages(pages);
    }

    async function buildKnowledgeFromPages(pages) {
        knowledge = { metadata: { crawledAt: new Date().toISOString(), sourceUrl: currentCrawlUrl, generator:'RAGina', version:'2.0' }, pages:[] };
        chunks = [];
        for (const page of pages) {
            const text = page.content;
            if (!text || text.length<50) continue;
            const sentences = text.split(/\n+|(?<=[.!?])\s+/); let current = ''; const rawChunks = [];
            for (const s of sentences) { if ((current+s).length>200 && current.length>0) { rawChunks.push(current.trim()); current=''; } current += s+' '; }
            if (current.trim()) rawChunks.push(current.trim());
            const limited = rawChunks.slice(0,8);
            // skip AI titles for speed; just use first sentence
            const enriched = limited.map((t,i) => ({ id:`${page.url}#chunk${i}`, title: t.split(/[.!?]/,1)[0].trim().slice(0,50), text:t, sourceUrl:page.url, chunkIndex:i }));
            knowledge.pages.push({ url:page.url, title:enriched[0]?.title||'Untitled', tags: extractTags(text), chunks:enriched });
            enriched.forEach(c => chunks.push(c));
        }
        rebuildIDF();
        updateKBTile();
        $('#kbSection').style.display = 'block';
        $('#chatMessages').innerHTML = '<div class="bot"><span>I\'ve read the selected pages. Ask me anything!</span></div>';
        if (githubToken) { try { await saveOrUpdateGist(true); } catch(e){} }
    }

    function extractTags(text, maxTags=5) {
        const stopWords = new Set(['the','a','an','is','are','was','were','be','been','being','have','has','had','do','does','did','but','and','or','if','because','as','until','while','of','at','by','for','with','about','into','through','during','before','after','to','from','in','out','on','off','over','under','again','further','then','once','here','there','when','where','why','how','all','any','both','each','few','more','most','other','some','such','no','nor','not','only','own','same','so','than','too','very','can','will','just','should','now']);
        const words = text.toLowerCase().match(/\b\w{4,}\b/g) || [];
        const freq = {}; words.forEach(w => { if(!stopWords.has(w)) freq[w]=(freq[w]||0)+1; });
        return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,maxTags).map(e=>e[0]);
    }
    function rebuildIDF() {
        idf = {}; const total = chunks.length||1;
        for (const ch of chunks) { const words = new Set(ch.text.toLowerCase().match(/\b\w+\b/g)||[]); for (const w of words) idf[w]=(idf[w]||0)+1; }
        for (const w in idf) idf[w] = Math.log(total/(1+idf[w]));
    }
    function updateKBTile() {
        const facts = chunks.length, updated = new Date(knowledge.metadata.crawledAt).toLocaleString();
        let gistInfo = currentGistId ? ` · <a href="https://gist.github.com/${currentGistId}" target="_blank">Gist saved</a>` : '';
        $('#kbStats').innerHTML = `<i class="fas fa-database me-1"></i> ${facts} facts · Updated ${updated}${gistInfo}`;
    }

    // ═══════════════════════════════════════════════
    //  CHAT
    // ═══════════════════════════════════════════════
    $('#askBtn').addEventListener('click', async () => {
        const q = $('#questionInput').value.trim(); if (!q) return;
        $('#questionInput').value = '';
        $('#chatMessages').innerHTML += `<div class="user"><span>${q}</span></div>`;
        const thinking = document.createElement('div'); thinking.className = 'bot'; thinking.innerHTML = '<span><i class="fas fa-spinner fa-pulse"></i> Thinking…</span>';
        $('#chatMessages').appendChild(thinking);
        try {
            const answer = await answerQuestion(q);
            thinking.remove();
            $('#chatMessages').innerHTML += `<div class="bot"><span>${answer}</span></div>`;
        } catch(e) { thinking.remove(); $('#chatMessages').innerHTML += `<div class="bot"><span class="text-danger">${e.message}</span></div>`; }
        $('#chatMessages').scrollTop = $('#chatMessages').scrollHeight;
    });
    async function answerQuestion(question) {
        const topChunks = retrieve(question, 5);
        let context = topChunks.map((c,i) => `[${i+1}] (${c.title}) ${c.text}`).join('\n\n');
        if (!context.trim() && knowledge) { const allTags = [...new Set(knowledge.pages.flatMap(p=>p.tags))]; context = allTags.length ? `Topics: ${allTags.join(', ')}.` : 'No info.'; }
        if (context.length > 2000) context = context.slice(0,2000)+'…';
        const prompt = `You are a helpful assistant. Using the context below, answer the user's question thoroughly. If the exact answer isn't there, provide a relevant summary.\n\nContext:\n${context}\n\nQuestion: ${question}\nAnswer:`;
        for (let attempt=0; attempt<3; attempt++) {
            try {
                const res = await fetch(ASK_PROXY, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({prompt}) });
                if (!res.ok) { const err = await res.json().catch(()=>({})); if (err.error?.includes('loading')) { await new Promise(r=>setTimeout(r,5000)); continue; } throw new Error(err.error||`HTTP ${res.status}`); }
                const data = await res.json(); if (data.error) throw new Error(data.error);
                let answer = data.text.trim(); if (answer.startsWith(prompt)) answer = answer.slice(prompt.length).trim();
                return answer;
            } catch(e) { if (attempt===2) throw e; await new Promise(r=>setTimeout(r,3000)); }
        }
    }
    function retrieve(query, topK=5) {
        const qWords = query.toLowerCase().match(/\b\w+\b/g)||[], qTF={}; qWords.forEach(w=>qTF[w]=(qTF[w]||0)+1);
        const scores = chunks.map((ch,idx) => { const cWords = ch.text.toLowerCase().match(/\b\w+\b/g)||[], cTF={}; cWords.forEach(w=>cTF[w]=(cTF[w]||0)+1); let score=0; for (const w of Object.keys(qTF)) if (cTF[w]&&idf[w]) score+=qTF[w]*cTF[w]*idf[w]; return {idx,score}; });
        scores.sort((a,b)=>b.score-a.score); return scores.slice(0,topK).map(s=>chunks[s.idx]);
    }

    // ═══════════════════════════════════════════════
    //  GIST & KB EDITING
    // ═══════════════════════════════════════════════
    async function saveOrUpdateGist(silent=false) {
        if (!githubToken) { if(!silent) showToast('Login first.','warning'); return; }
        if (!knowledge || savingGist) return; savingGist = true;
        const btns = [$('#gistBtn'), $('#gistBtn2')].filter(b=>b);
        btns.forEach(b=>{ b.disabled=true; b.innerHTML='<span class="spinner-border spinner-border-sm"></span> Saving...'; });
        try {
            await loadGistMemory();
            const normalizedUrl = normalizeUrl(currentCrawlUrl || knowledge.metadata.sourceUrl);
            const gistId = currentGistId || gistMemory[normalizedUrl] || undefined;
            const siteId = getSiteIdentifier(currentCrawlUrl || knowledge.metadata.sourceUrl);
            const fileName = `ragina-${siteId}-kb.json`;
            const files = { [fileName]: { content: JSON.stringify(knowledge, null, 2) } };
            const res = await fetch(GIST_PROXY, { method:'POST', headers:{'Content-Type':'application/json', Authorization:`Bearer ${githubToken}`}, body:JSON.stringify({ description:`RAGina: ${currentCrawlUrl||knowledge.metadata.sourceUrl}`, files, gistId }) });
            const data = await res.json(); if (data.error) throw new Error(data.error);
            currentGistId = data.id; gistMemory[normalizedUrl] = data.id;
            updateKBTile();
            if (!silent) showToast(`Gist ${gistId?'updated':'saved'} (${fileName}).`, 'success');
            await loadGistMemory();
        } catch(e) { if(!silent) showToast('Gist error: '+e.message, 'danger'); }
        finally { savingGist = false; btns.forEach(b=>{ b.disabled=false; b.innerHTML='<i class="fab fa-github me-1"></i> Save to Gist'; }); }
    }
    $('#gistBtn').addEventListener('click', ()=>saveOrUpdateGist());
    $('#gistBtn2').addEventListener('click', ()=>saveOrUpdateGist());
    $('#editKbBtn').addEventListener('click', () => { if(!knowledge) return; $('#kbEditorTextarea').value = JSON.stringify(knowledge,null,2); new bootstrap.Modal($('#kbEditorModal')).show(); });
    $('#editKbBtn2').addEventListener('click', () => { if(!knowledge) return; $('#kbEditorTextarea').value = JSON.stringify(knowledge,null,2); new bootstrap.Modal($('#kbEditorModal')).show(); });
    $('#saveKbBtn').addEventListener('click', async () => {
        try { knowledge = JSON.parse($('#kbEditorTextarea').value); chunks = []; knowledge.pages.forEach(p=>p.chunks.forEach(c=>chunks.push(c))); rebuildIDF(); updateKBTile(); showToast('KB updated.','success'); if (githubToken) await saveOrUpdateGist(true); bootstrap.Modal.getInstance($('#kbEditorModal')).hide(); } catch(e) { showToast('Invalid JSON: '+e.message, 'danger'); }
    });
    $('#downloadBtn').addEventListener('click', () => { if(!knowledge) return; const blob = new Blob([JSON.stringify(knowledge,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='ragina-knowledge.json'; a.click(); URL.revokeObjectURL(url); });
    $('#downloadBtn2').addEventListener('click', () => { if(!knowledge) return; const blob = new Blob([JSON.stringify(knowledge,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='ragina-knowledge.json'; a.click(); URL.revokeObjectURL(url); });

    // ═══════════════════════════════════════════════
    //  PR BOT LOGIC
    // ═══════════════════════════════════════════════
    document.querySelectorAll('input[name="injectMode"]').forEach(r => r.addEventListener('change', () => {
        if ($('#modeNew').checked) { $('#existingFileSection').style.display='none'; $('#newFileSection').style.display='block'; }
        else { $('#existingFileSection').style.display='block'; $('#newFileSection').style.display='none'; }
    }));

    function checkPRReady() {
        const ready = !!githubToken && isRepoMode && !!knowledge && !!$('#productName').value.trim();
        $('#raisePRBtn').disabled = !ready;
        if (ready) setStatus($('#prStatus'), '✅ Ready to raise PR.', 'success');
        else setStatus($('#prStatus'), 'Login, scan a repo, scrape pages, and enter a product name.', 'info');
    }
    $('#productName').addEventListener('input', checkPRReady);
    $('#raisePRBtn').addEventListener('click', async () => {
        const btn = $('#raisePRBtn'); btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Working...';
        const productName = $('#productName').value.trim(), accent = $('#accentColor').value || '#6C63FF', isNew = $('#modeNew').checked;
        const loc = $('#injectLocation').value;
        try {
            logPR('Scraping repo knowledge...', 'info');
            // Re-scrape selected files if needed (or use existing knowledge). For PR, we need snippet with knowledge. We'll use the already built knowledge.
            // Build snippet
            const snippet = makeSnippet(productName, accent, knowledge);
            const baseBranch = 'main'; let baseSha;
            try { const r = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/git/ref/heads/main`, { headers: { Authorization: `Bearer ${githubToken}`, Accept: 'application/vnd.github+json' } }); baseSha = (await r.json()).object.sha; } catch { const r = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/git/ref/heads/master`, { headers: { Authorization: `Bearer ${githubToken}`, Accept: 'application/vnd.github+json' } }); baseSha = (await r.json()).object.sha; }
            currentBranchName = `ragina-${Date.now()}`;
            logPR(`Creating branch ${currentBranchName}...`, 'info');
            await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/git/refs`, { method:'POST', headers: { Authorization: `Bearer ${githubToken}`, Accept: 'application/vnd.github+json' }, body: JSON.stringify({ ref: `refs/heads/${currentBranchName}`, sha: baseSha }) });
            if (isNew) {
                logPR('Creating standalone chatbot page...', 'info');
                const page = makeStandalone(productName, accent, knowledge);
                const content = btoa(unescape(encodeURIComponent(page)));
                await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/ragina-chatbot.html`, { method:'PUT', headers: { Authorization: `Bearer ${githubToken}`, Accept: 'application/vnd.github+json' }, body: JSON.stringify({ message: `🤖 Add RAGina chatbot for ${productName}`, content, branch: currentBranchName }) });
            } else {
                const filePath = $('#targetFileSelect').value;
                logPR(`Injecting into ${filePath}...`, 'info');
                const fileRes = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${filePath}`, { headers: { Authorization: `Bearer ${githubToken}`, Accept: 'application/vnd.github+json' } });
                const fileData = await fileRes.json();
                const current = atob(fileData.content);
                const updated = injectSnippet(current, snippet, loc);
                const encoded = btoa(unescape(encodeURIComponent(updated)));
                await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${filePath}`, { method:'PUT', headers: { Authorization: `Bearer ${githubToken}`, Accept: 'application/vnd.github+json' }, body: JSON.stringify({ message: `🤖 Inject RAGina into ${filePath}`, content: encoded, sha: fileData.sha, branch: currentBranchName }) });
            }
            logPR('Creating PR...', 'info');
            const prTitle = $('#prTitle').value || `🤖 Add RAGina AI Chatbot for ${productName}`;
            const prBody = $('#prBody').value || '';
            const changeDesc = isNew ? 'Adds standalone chatbot page' : `Injects chatbot into \`${$('#targetFileSelect').value}\``;
            const prRes = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/pulls`, { method:'POST', headers: { Authorization: `Bearer ${githubToken}`, Accept: 'application/vnd.github+json' }, body: JSON.stringify({ title: prTitle, head: currentBranchName, base: baseBranch, body: `## 🤖 RAGina AI Chatbot\n\n${changeDesc}\n\n### ✨ What You Get\n- 💬 Floating chat bubble\n- 🧠 Knowledge from ${Object.keys(knowledge.pages).length} pages\n- 🔐 No API keys\n- 📱 Mobile ready\n\n${prBody}` }) });
            const pr = await prRes.json();
            logPR(`🎉 PR #${pr.number} created!`, 'success');
            showToast(`PR #${pr.number} created. <a href="${pr.html_url}" target="_blank">View</a>`, 'success');
        } catch(e) { logPR(`Error: ${e.message}`, 'error'); showToast('PR failed: '+e.message, 'danger'); }
        btn.disabled = false; btn.innerHTML = '🔮 Raise PR';
    });

    function makeSnippet(productName, accentColor, knowledge) {
        const json = JSON.stringify(knowledge);
        return `
<!-- 🤖 RAGina Chatbot - ${productName} -->
<script>window.__RAGINA_INDEX__=${json};<\/script>
<script>window.RAGINA_CONFIG={title:'${productName} Bot',placeholder:'Ask about ${productName}...',position:'bottom-right',theme:{primary:'${accentColor}'}};<\/script>
<script src="https://cdn.jsdelivr.net/gh/suryasticsai/RAGina@main/ragina.js"><\/script>`;
    }
    function makeStandalone(productName, accentColor, knowledge) {
        const r=parseInt(accentColor.slice(1,3),16), g=parseInt(accentColor.slice(3,5),16), b=parseInt(accentColor.slice(5,7),16);
        return `<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>${productName} - AI Chatbot</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f5f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center}.c{text-align:center;padding:2rem}h1{font-size:2.5rem;background:linear-gradient(135deg,${accentColor},#FF6584);-webkit-background-clip:text;-webkit-text-fill-color:transparent}p{color:#666;font-size:1.2rem;margin-top:.5rem}.b{display:inline-block;margin-top:2rem;padding:.8rem 2rem;background:rgba(${r},${g},${b},0.1);border-radius:30px;color:${accentColor};font-weight:600}</style>
</head><body><div class="c"><h1>🤖 AI Chatbot</h1><p>Ask about <strong>${productName}</strong></p><div class="b">👇 Click chat bubble</div></div>
${makeSnippet(productName, accentColor, knowledge)}
</body></html>`;
    }
    function injectSnippet(html, snippet, loc) {
        switch(loc) {
            case 'beforeBodyEnd': return html.replace('</body>', snippet+'\n</body>');
            case 'afterBodyStart': return html.replace(/<body[^>]*>/i, m => m+'\n'+snippet);
            case 'beforeHeadEnd': return html.replace('</head>', snippet+'\n</head>');
            default: return html.replace('</body>', snippet+'\n</body>');
        }
    }

    // Initialize
    checkPRReady();
    </script>
</body>
